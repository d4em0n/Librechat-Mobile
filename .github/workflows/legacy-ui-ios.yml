name: Legacy MCP-UI SideStore IPA

on:
  workflow_dispatch:
  push:
    branches: [fix/legacy-mcp-ui-natural-size]

permissions:
  contents: read

concurrency:
  group: legacy-ui-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check native names and chat lint
        run: |
          python3 scripts/check-native-test-names.py
          ./gradlew :feature:chat:detekt
      - name: Test legacy size reports and actions
        run: ./gradlew :feature:chat:testDebugUnitTest --tests '*LegacyUiFrameHostTest'

  ios:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Test real iOS legacy WebView sizing and horizontal scrolling
        run: ./gradlew :feature:chat:iosSimulatorArm64Test --tests '*LegacyUiResourceBlockIosTest'
      - name: Archive unsigned device app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" "CODE_SIGN_IDENTITY[sdk=iphoneos*]=" \
            CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" ONLY_ACTIVE_ARCH=NO
      - name: Package IPA for SideStore
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications"
          shopt -s nullglob
          apps=(./*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one archived app, found ${#apps[@]}"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :SwitchboardChannel' "${apps[0]}/Info.plist")" = oss
          mkdir -p "$GITHUB_WORKSPACE/build/sidestore/Payload"
          cp -R "${apps[0]}" "$GITHUB_WORKSPACE/build/sidestore/Payload/"
          cd "$GITHUB_WORKSPACE/build/sidestore"
          zip -qry switchboard-legacy-ui.ipa Payload
          shasum -a 256 switchboard-legacy-ui.ipa > switchboard-legacy-ui.ipa.sha256
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: switchboard-legacy-ui-unsigned-ios
          path: |
            build/sidestore/switchboard-legacy-ui.ipa
            build/sidestore/switchboard-legacy-ui.ipa.sha256
            build/sidestore/source-commit.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload iOS regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-ui-ios-tests
          path: feature/chat/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: ignore
